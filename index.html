<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uma</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27 shape-rendering=%27crispEdges%27%3E%3Crect width=%278%27 height=%278%27 fill=%27%23f4b92f%27/%3E%3Cpath fill=%27%232a120a%27 d=%27M1 1h2v5h2V1h2v6H1z%27/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=Bangers&display=swap" />
</head>
<body>
  <!-- The game is a fixed 1920x1080 frame, scaled to fit the window (see fit() in main.ts). -->
  <div id="game">
    <canvas id="cv" width="640" height="360" role="img" aria-label="Pixel art scene"></canvas>

    <div class="hud">
      <div class="brand">
        <h1 id="title">Uma</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <section class="goal" aria-label="Savings goal">
        <div class="goal-row">
          <span class="lab"><svg class="ico" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1a1a1a" d="M2 0h4v1h1v1h1v4H7v1H6v1H2V7H1V6H0V2h1V1h1z"/><path fill="#f2c94c" d="M2 1h4v1h1v4H6v1H2V6H1V2h1z"/><path fill="#b8800f" d="M3 2h1v4H3zM4 5h1v1H4z"/></svg><em id="g-l"></em></span>
          <span class="val"><b id="g-v"></b><em class="delta" id="g-d"></em></span>
        </div>
        <div class="bar goalbar"><i id="g-b"></i><u style="left:25%"></u><u style="left:50%"></u><u style="left:75%"></u><s id="g-f"></s></div>
        <div class="goal-sub"><span id="g-s"></span><b id="g-p"></b></div>
      </section>
      <div class="meter">
        <span><em class="lab"><svg class="ico" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1a1a1a" d="M1 1h2v1h2V1h2v1h1v2H7v1H6v1H5v1H3V6H2V5H1V4H0V2h1z"/><path fill="#e05a5a" d="M1 2h2v1h2V2h2v2H6v1H5v1H3V5H2V4H1z"/></svg><em id="m-l"></em></em><b id="m-v"></b></span>
        <div class="bar"><i id="m-b"></i></div>
        <div class="sub2" id="m-s"></div>
      </div>
      <div class="meter">
        <span><em class="lab"><svg class="ico" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1a1a1a" d="M0 1h8v7H0z"/><path fill="#f4f1e4" d="M1 3h6v4H1z"/><path fill="#d0452d" d="M1 1h6v2H1z"/><path fill="#1a1a1a" d="M2 0h1v2H2zM5 0h1v2H5z"/></svg><em id="mo-l"></em></em><b id="mo-v"></b></span>
        <div class="pips" id="mo-p"></div>
        <div class="sub2" id="mo-s"></div>
      </div>
    </div>
    <div class="ctrls">
      <button id="snd" class="toggle" aria-pressed="true"></button>
      <div class="seg" role="group" aria-label="Language">
        <button id="l-en" aria-pressed="true">EN</button><button id="l-fil" aria-pressed="false">FIL</button>
      </div>
    </div>

    <button class="backbtn" id="back" hidden></button>
    <div class="stage-label" id="lbl"></div>
    <div class="menu" id="menu" role="menu"></div>
    <div class="intro" id="intro" aria-live="polite"></div>
    <main class="panel" id="panel" aria-live="polite"></main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
