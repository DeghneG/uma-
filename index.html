<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Inter:wght@400;500;600&display=swap" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1 id="title">Uma</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="ctrls">
        <button id="snd" class="toggle" aria-pressed="true"></button>
        <div class="seg" role="group" aria-label="Language">
          <button id="l-en" aria-pressed="true">EN</button><button id="l-fil" aria-pressed="false">FIL</button>
        </div>
      </div>
    </header>

    <section class="goal" aria-label="Savings goal">
      <div class="goal-row"><span id="g-l"></span><b id="g-v"></b></div>
      <div class="bar"><i id="g-b"></i></div>
      <div class="goal-sub" id="g-s"></div>
    </section>

    <div class="stage">
      <canvas id="cv" width="96" height="54" role="img" aria-label="Pixel art scene"></canvas>
      <div class="stage-label" id="lbl"></div>
    </div>

    <section class="meters" aria-label="Status">
      <div class="meter"><span><em id="m-l"></em><b id="m-v"></b></span><div class="bar"><i id="m-b"></i></div></div>
      <div class="meter"><span><em id="mo-l"></em><b id="mo-v"></b></span><div class="bar time"><i id="mo-b"></i></div></div>
    </section>

    <main class="panel" id="panel" aria-live="polite"></main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
